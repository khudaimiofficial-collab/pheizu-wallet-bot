<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pheizu Wallet</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #090d16);
      --card: var(--tg-theme-secondary-bg-color, #111827);
      --text: var(--tg-theme-text-color, #f3f4f6);
      --muted: var(--tg-theme-hint-color, #9ca3af);
      --button: var(--tg-theme-button-color, #00d084);
      --button-text: var(--tg-theme-button-text-color, #000000);
      --border: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .balance-title { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .balance-amount { font-size: 32px; font-weight: bold; color: var(--button); margin: 6px 0; }
    .tabs {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--border); color: var(--text); }
    input {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      margin: 8px 0 14px;
      font-size: 14px;
    }
    .btn-action {
      width: 100%;
      padding: 13px;
      background: var(--button);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-action:disabled { opacity: 0.5; }
    .qr-box {
      text-align: center;
      background: var(--bg);
      padding: 14px;
      border-radius: 10px;
      margin-top: 14px;
      border: 1px solid var(--border);
    }
    #qrcode { background: white; padding: 10px; border-radius: 8px; display: inline-block; }
    .invoice-text {
      font-family: monospace;
      font-size: 10px;
      word-break: break-all;
      background: var(--card);
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      color: var(--muted);
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Balance Card -->
  <div class="card">
    <div class="balance-title">⚡ Available Balance</div>
    <div id="balanceDisplay" class="balance-amount">Loading...</div>
    <button onclick="loadBalance()" style="background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer;">
      🔄 Tap to Refresh
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button id="tabReceive" class="tab-btn active" onclick="switchTab('receive')">Receive Sats</button>
    <button id="tabSend" class="tab-btn" onclick="switchTab('send')">Send Sats</button>
  </div>

  <!-- Receive Panel -->
  <div id="receivePanel" class="card">
    <label style="font-size:12px; color:var(--muted);">Amount in Satoshis (sats):</label>
    <input type="number" id="receiveAmount" placeholder="e.g. 100" value="100" />
    <button id="btnReceive" class="btn-action" onclick="createReceiveInvoice()">Generate Invoice QR</button>

    <div id="qrResult" class="qr-box hidden">
      <div id="qrcode"></div>
      <div id="invoiceString" class="invoice-text"></div>
      <button class="btn-action" style="margin-top:10px; font-size:12px; padding:8px;" onclick="copyInvoice()">Copy Invoice</button>
    </div>
  </div>

  <!-- Send Panel -->
  <div id="sendPanel" class="card hidden">
    <label style="font-size:12px; color:var(--muted);">Destination (Address or Invoice):</label>
    <input type="text" id="sendDest" placeholder="user@speed.app or lnbc..." />
    <label style="font-size:12px; color:var(--muted);">Amount (sats):</label>
    <input type="number" id="sendAmount" placeholder="e.g. 50" />
    <button id="btnSend" class="btn-action" onclick="sendSats()">Send Instantly</button>
    <div id="sendFeedback" style="font-size:12px; margin-top:10px; text-align:center;"></div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  function haptic(type = "light") {
    try { tg?.HapticFeedback?.impactOccurred(type); } catch(e){}
  }

  async function loadBalance() {
    haptic("light");
    const el = document.getElementById("balanceDisplay");
    el.innerText = "...";
    try {
      const res = await fetch("/api/wallet?action=balance");
      const data = await res.json();
      const avail = data.available?.find(b => b.currency === "SATS")?.amount || 0;
      el.innerText = `${Number(avail).toLocaleString()} sats`;
    } catch (e) {
      el.innerText = "Active";
    }
  }

  async function createReceiveInvoice() {
    haptic("medium");
    const amount = document.getElementById("receiveAmount").value;
    const btn = document.getElementById("btnReceive");
    if (!amount || amount <= 0) return alert("Enter amount");

    btn.disabled = true;
    btn.innerText = "Creating...";

    try {
      const res = await fetch("/api/wallet?action=create-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount })
      });
      const payment = await res.json();
      const invoice = payment.payment_method_details?.lightning?.payment_request || payment.payment_request || payment.url;

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: invoice, width: 170, height: 170 });

      document.getElementById("invoiceString").innerText = invoice;
      document.getElementById("qrResult").classList.remove("hidden");
      haptic("heavy");
    } catch(err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Generate Invoice QR";
    }
  }

  async function sendSats() {
    haptic("medium");
    const destination = document.getElementById("sendDest").value.trim();
    const amount = document.getElementById("sendAmount").value;
    const feedback = document.getElementById("sendFeedback");
    const btn = document.getElementById("btnSend");

    if (!destination || !amount) return alert("Fill in destination and amount");

    btn.disabled = true;
    btn.innerText = "Sending...";
    feedback.innerText = "Broadcasting across Lightning Network...";

    try {
      const res = await fetch("/api/wallet?action=send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ destination, amount })
      });
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      feedback.innerHTML = `<span style="color:var(--button)">✓ Sent ${amount} sats successfully!</span>`;
      haptic("heavy");
      document.getElementById("sendDest").value = "";
      loadBalance();
    } catch (err) {
      feedback.innerHTML = `<span style="color:#ef4444">Failed: ${err.message}</span>`;
    } finally {
      btn.disabled = false;
      btn.innerText = "Send Instantly";
    }
  }

  function switchTab(t) {
    haptic("light");
    if (t === 'receive') {
      document.getElementById("tabReceive").classList.add("active");
      document.getElementById("tabSend").classList.remove("active");
      document.getElementById("receivePanel").classList.remove("hidden");
      document.getElementById("sendPanel").classList.add("hidden");
    } else {
      document.getElementById("tabSend").classList.add("active");
      document.getElementById("tabReceive").classList.remove("active");
      document.getElementById("sendPanel").classList.remove("hidden");
      document.getElementById("receivePanel").classList.add("hidden");
    }
  }

  function copyInvoice() {
    navigator.clipboard.writeText(document.getElementById("invoiceString").innerText);
    haptic("light");
    alert("Invoice copied!");
  }

  loadBalance();
</script>
</body>
</html>
