<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pheizu Wallet</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #090d16);
      --card: var(--tg-theme-secondary-bg-color, #111827);
      --text: var(--tg-theme-text-color, #f3f4f6);
      --muted: var(--tg-theme-hint-color, #9ca3af);
      --button: var(--tg-theme-button-color, #00d084);
      --button-text: var(--tg-theme-button-text-color, #000000);
      --border: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .balance-title { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .balance-amount { font-size: 34px; font-weight: bold; color: var(--button); margin: 6px 0; }
    .address-badge {
      background: #090d16;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .address-text {
      color: var(--button);
      font-family: monospace;
      font-weight: bold;
      word-break: break-all;
    }
    .tabs {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--border); color: var(--text); }
    input {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      margin: 8px 0 14px;
      font-size: 14px;
      font-family: monospace;
    }
    .btn-action {
      width: 100%;
      padding: 13px;
      background: var(--button);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-action:disabled { opacity: 0.5; }
    .qr-box {
      text-align: center;
      background: var(--bg);
      padding: 14px;
      border-radius: 10px;
      margin-top: 14px;
      border: 1px solid var(--border);
    }
    #qrcode { background: white; padding: 10px; border-radius: 8px; display: inline-block; }
    .invoice-text {
      font-family: monospace;
      font-size: 10px;
      word-break: break-all;
      background: var(--card);
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      color: var(--muted);
    }
    .hidden { display: none !important; }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--button);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="balance-title">⚡ Available Balance</div>
    <div id="balanceDisplay" class="balance-amount">0 sats</div>
    
    <div class="address-badge">
      <div>
        <span style="font-size:10px; color:var(--muted); display:block;">YOUR LIGHTNING ADDRESS:</span>
        <span id="userLnAddress" class="address-text">loading...</span>
      </div>
      <button onclick="copyAddress()" style="background:var(--border); border:none; color:var(--text); padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer;">
        Copy
      </button>
    </div>

    <button onclick="loadBalance()" style="background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer; margin-top:10px;">
      🔄 Sync Balance
    </button>
  </div>

  <div class="tabs">
    <button id="tabReceive" class="tab-btn active" onclick="switchTab('receive')">Receive</button>
    <button id="tabSend" class="tab-btn" onclick="switchTab('send')">Send</button>
  </div>

  <div id="receivePanel" class="card">
    <label style="font-size:12px; color:var(--muted);">Amount in Satoshis (sats):</label>
    <input type="number" id="receiveAmount" placeholder="e.g. 100" value="10" />
    <button id="btnReceive" class="btn-action" onclick="createReceiveInvoice()">Generate Invoice QR</button>

    <div id="qrResult" class="qr-box hidden">
      <div id="qrcode"></div>
      <p id="listenNotice" style="font-size:12px; color:#f59e0b; margin-top:8px;">⏳ Waiting for payment...</p>
      <div id="invoiceString" class="invoice-text"></div>
      <button class="btn-action" style="margin-top:10px; font-size:12px; padding:8px;" onclick="copyInvoice()">Copy Invoice</button>
    </div>
  </div>

  <div id="sendPanel" class="card hidden">
    <label style="font-size:12px; color:var(--muted);">Destination (Address or Invoice):</label>
    <input type="text" id="sendDest" placeholder="name@speed.app, or lnbc..." />
    <label style="font-size:12px; color:var(--muted);">Amount (sats):</label>
    <input type="number" id="sendAmount" placeholder="e.g. 5" />
    <button id="btnSend" class="btn-action" onclick="sendSats()">Send From Balance</button>
    <div id="sendFeedback" style="font-size:12px; margin-top:10px; text-align:center;"></div>
  </div>

  <div id="successModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div style="font-size:42px; margin-bottom:10px;">🎉</div>
      <h3 style="color:var(--button); margin-bottom:6px;">Payment Successful!</h3>
      <p id="modalAmountText" style="font-size:14px; color:var(--text); margin-bottom:14px;"></p>
      <p id="modalBalanceText" style="font-size:12px; color:var(--muted); margin-bottom:20px;"></p>
      <button class="btn-action" onclick="closeSuccessModal()">Awesome!</button>
    </div>
  </div>

<script>
  const DOMAIN = "pheizu-wallet-bot.vercel.app";
  const tg = window.Telegram?.WebApp;
  
  const tgUser = tg?.initDataUnsafe?.user;
  const username = tgUser?.username || (tgUser?.id ? `user${tgUser.id}` : localStorage.getItem("saved_user") || "guest");
  localStorage.setItem("saved_user", username);

  const currentUserId = String(tgUser?.id || username);
  const myLightningAddress = `${username.toLowerCase()}@${DOMAIN}`;

  document.getElementById("userLnAddress").innerText = myLightningAddress;

  let activeCheckTimer = null;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  function haptic(type = "light") {
    try { tg?.HapticFeedback?.impactOccurred(type); } catch(e){}
  }
  function hapticNotification(type = "success") {
    try { tg?.HapticFeedback?.notificationOccurred(type); } catch(e){}
  }

  async function loadBalance() {
    haptic("light");
    const el = document.getElementById("balanceDisplay");
    const cachedBal = localStorage.getItem(`bal_${currentUserId}`);
    if (cachedBal) el.innerText = `${Number(cachedBal).toLocaleString()} sats`;

    try {
      const res = await fetch(`/api/wallet?action=balance&user_id=${currentUserId}`);
      const data = await res.json();
      const finalBal = Number(data.balance || cachedBal || 0);
      el.innerText = `${finalBal.toLocaleString()} sats`;
      localStorage.setItem(`bal_${currentUserId}`, finalBal);
    } catch (e) {}
  }

  async function createReceiveInvoice() {
    haptic("medium");
    const amount = document.getElementById("receiveAmount").value;
    const btn = document.getElementById("btnReceive");
    if (!amount || amount <= 0) return alert("Enter amount");

    btn.disabled = true;
    btn.innerText = "Generating...";
    if (activeCheckTimer) clearInterval(activeCheckTimer);

    try {
      const res = await fetch("/api/wallet?action=create-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount, user_id: currentUserId })
      });
      const payment = await res.json();
      if (payment.error) throw new Error(payment.error);

      let invoice = "";
      function scan(o) {
        if (!o || typeof o !== "object") return;
        for (const [k, v] of Object.entries(o)) {
          if (typeof v === "string") {
            const str = v.trim();
            if (/^(lnbc|lntb|lightning:)/i.test(str)) { if (!invoice) invoice = str; }
            else if ((k.toLowerCase().includes("url") || k === "link") && /^https?:\/\//i.test(str)) { if (!invoice) invoice = str; }
          } else if (typeof v === "object") scan(v);
        }
      }
      scan(payment);

      const qrTarget = invoice || payment.id;
      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: qrTarget, width: 170, height: 170 });

      document.getElementById("invoiceString").innerText = invoice || payment.id;
      document.getElementById("qrResult").classList.remove("hidden");
      document.getElementById("listenNotice").innerText = "⏳ Waiting for payment (Auto-verifying)...";

      startAutoVerification(payment.id, Number(amount));
    } catch(err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Generate Invoice QR";
    }
  }

  function startAutoVerification(paymentId, amount) {
    let attempts = 0;
    activeCheckTimer = setInterval(async () => {
      attempts++;
      if (attempts > 80) return clearInterval(activeCheckTimer);

      try {
        const res = await fetch(`/api/wallet?action=check-status&payment_id=${paymentId}&user_id=${currentUserId}`);
        const data = await res.json();

        if (data.is_paid) {
          clearInterval(activeCheckTimer);
          document.getElementById("listenNotice").innerText = "✅ Paid!";

          if (data.credited_now || !localStorage.getItem(`seen_${paymentId}`)) {
            localStorage.setItem(`seen_${paymentId}`, "1");
            localStorage.setItem(`bal_${currentUserId}`, data.balance);
            triggerSuccessPopup(amount, data.balance);
          } else {
            loadBalance();
          }
        }
      } catch (e) {}
    }, 2500);
  }

  function triggerSuccessPopup(amount, newBalance) {
    hapticNotification("success");
    if (tg && tg.showPopup) {
      tg.showPopup({
        title: "⚡ Payment Received!",
        message: `+${amount} sats added to your balance!\nNew Balance: ${newBalance} sats`,
        buttons: [{ type: "ok", text: "Awesome!" }]
      });
    }

    document.getElementById("modalAmountText").innerText = `+${amount} Satoshis Added!`;
    document.getElementById("modalBalanceText").innerText = `Your New Balance: ${newBalance} sats`;
    document.getElementById("successModal").classList.remove("hidden");

    loadBalance();
  }

  function closeSuccessModal() {
    document.getElementById("successModal").classList.add("hidden");
    document.getElementById("qrResult").classList.add("hidden");
  }

  async function sendSats() {
    haptic("medium");
    const destination = document.getElementById("sendDest").value.trim();
    const amount = Number(document.getElementById("sendAmount").value);
    const feedback = document.getElementById("sendFeedback");
    const btn = document.getElementById("btnSend");

    const currentBal = Number(localStorage.getItem(`bal_${currentUserId}`) || 0);
    if (!destination || !amount) return alert("Fill in destination and amount");
    if (currentBal < amount) return alert(`Insufficient balance! You have ${currentBal} sats.`);

    btn.disabled = true;
    btn.innerText = "Sending...";
    feedback.innerText = "Broadcasting across Lightning Network...";

    try {
      const res = await fetch("/api/wallet?action=send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ destination, amount, user_id: currentUserId })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      hapticNotification("success");
      localStorage.setItem(`bal_${currentUserId}`, data.balance);

      feedback.innerHTML = `<span style="color:var(--button)">✓ Sent ${amount} sats successfully!</span>`;
      document.getElementById("sendDest").value = "";
      loadBalance();
    } catch (err) {
      hapticNotification("error");
      feedback.innerHTML = `<span style="color:#ef4444">Failed: ${err.message}</span>`;
    } finally {
      btn.disabled = false;
      btn.innerText = "Send From Balance";
    }
  }

  function switchTab(t) {
    haptic("light");
    if (t === 'receive') {
      document.getElementById("tabReceive").classList.add("active");
      document.getElementById("tabSend").classList.remove("active");
      document.getElementById("receivePanel").classList.remove("hidden");
      document.getElementById("sendPanel").classList.add("hidden");
    } else {
      document.getElementById("tabSend").classList.add("active");
      document.getElementById("tabReceive").classList.remove("active");
      document.getElementById("sendPanel").classList.remove("hidden");
      document.getElementById("receivePanel").classList.add("hidden");
    }
  }

  function copyInvoice() {
    navigator.clipboard.writeText(document.getElementById("invoiceString").innerText);
    haptic("light");
    alert("Invoice copied!");
  }

  function copyAddress() {
    navigator.clipboard.writeText(myLightningAddress);
    haptic("light");
    alert("Lightning Address copied!\n" + myLightningAddress);
  }

  loadBalance();
</script>
</body>
</html>
